<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HTML MVC Starter</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>

      <span class="app-badge">PM0204</span>
      <h1 id="page-title">HTML MVC Starter Template</h1>
